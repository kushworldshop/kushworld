name: Deploy to Hetzner

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.62.249.173
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/kushworld
            mkdir -p /var/www/kushworld-data-keep
            if [ -d data ]; then cp -a data/. /var/www/kushworld-data-keep/; fi
            git pull origin main
            mkdir -p data
            cp -a /var/www/kushworld-data-keep/. data/
            npm ci
            npm run build
            mkdir -p data
            pm2 restart kushworld || pm2 start npm --name "kushworld" -- start
            pm2 save
            # One-time HTTPS setup (run manually if https://kushworld.shop fails):
            # CERTBOT_EMAIL=you@email.com bash scripts/setup-ssl.sh